# Explicitly loaded with --config. No automatic system-wide configuration.
# Values are literal; no quotes, shell expansion, or inline comments.
device = default
rate = 8000
auto-offset = true
harm-reject = 0.5
min-snr = 3
verbose = false
# Foreground is suitable for a supervisor. --daemon overrides this.
daemon = false
pidfile = /run/wwvdecode.pid
logfile = /var/log/wwvdecode.log
# Prefer SOCK with chrony. chronyd creates this socket first.
sock = /run/chrony/wwv.sock
# -1 disables SHM. Use an unused unit if enabling it (e.g. 2).
shm-unit = -1
# SHM precision as a power-of-two exponent: -5 is ~31 milliseconds.
precision = -5
# Seconds ADDED to the reference time. Calibrate receiver/audio/path delay.
correction = 0
