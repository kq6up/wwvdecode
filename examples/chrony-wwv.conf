# Snippet for an existing chrony configuration. Review paths/permissions first.
# Begin with noselect while measuring and calibrating the source.
refclock SOCK /run/chrony/wwv.sock refid WWV poll 4 filter 4 precision 0.03125 delay 0.05 noselect
# Alternative using a private SHM unit; run the producer with the same UID
# that owns the segment (chronyd can attach as root before dropping privilege).
# refclock SHM 2:perm=0600 refid WWV poll 4 filter 4 precision 0.03125 delay 0.05 noselect
